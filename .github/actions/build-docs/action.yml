name: Build Documentation
description: Build the playground and render the documentation site without publishing.

runs:
  using: composite
  steps:
    - name: Set up Rust
      shell: bash
      run: |
        rustup toolchain install
        rustup target add wasm32-unknown-unknown

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: "false"
        prefix-key: "v1-docs"

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::rmarkdown, any::bookdown

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Restore timestamps
      uses: chetan/git-restore-mtime-action@v2

    - name: Build documentation and public downloads
      shell: bash
      run: bash scripts/build-docs.sh

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: workers/package-lock.json

    - name: Install website deployment tools
      shell: bash
      working-directory: workers
      run: npm ci

    - name: Test website request handling
      shell: bash
      working-directory: workers
      run: npm test

    - name: Validate Workers deployment
      shell: bash
      working-directory: workers
      run: npm run deploy:check

    - name: Test built website through Workers
      shell: bash
      working-directory: workers
      run: npm run test:site
