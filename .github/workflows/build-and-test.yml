name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.95 MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          prefix-key: "v1-rust-msrv"

      - name: Check workspace
        run: cargo +1.95.0 check --workspace --all-targets --all-features

  test:
    if: github.event_name != 'schedule'
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          prefix-key: "v1-rust"

      - name: Install wasm target
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add wasm32-unknown-unknown

      - name: Build panache-wasm
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p panache-wasm --target wasm32-unknown-unknown --verbose

      - name: Install shfmt for external formatter tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y shfmt

      - name: Run tests
        run: cargo test --workspace --verbose

  extension:
    name: VS Code Extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/code/package-lock.json

      - name: Install dependencies
        working-directory: editors/code
        run: npm ci

      # Packaging validates compatibility between the VS Code API types and
      # the extension's declared minimum VS Code version.
      - name: Package extension
        working-directory: editors/code
        run: npm run package -- --target win32-arm64 -o /tmp/panache.vsix

  zed:
    name: Zed Extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Install wasm target
        run: rustup target add wasm32-wasip2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
          prefix-key: "v1-zed"

      # `editors/zed` is its own workspace, so none of the workspace-wide jobs
      # above reach it: until this job existed, the extension was only ever
      # compiled by Zed's registry, long after the change that broke it landed.
      - name: Check formatting
        working-directory: editors/zed
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: editors/zed
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: editors/zed
        run: cargo test --locked

      # `--locked` is also what catches a `Cargo.lock` left behind by a version
      # bump, since nothing else regenerates it.
      - name: Build extension
        working-directory: editors/zed
        run: cargo build --release --target wasm32-wasip2 --locked

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cargo-deny, msrv, test, extension, zed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.versionary.outputs.release_created }}
      tag_name: ${{ steps.versionary.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        run: rustup toolchain install

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  build-release-assets:
    name: Build & Upload Release Assets
    needs: versionary
    if: ${{ needs.versionary.outputs.release_created == 'true' }}
    uses: ./.github/workflows/packages.yml
    with:
      upload: "true"
      tag: ${{ needs.versionary.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  publish-code-extensions:
    name: Publish Code Extensions
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-code-extensions.yml
    secrets: inherit
    permissions:
      contents: read

  # Only the primary CLI stream (`v*`) carries the binaries the PKGBUILD
  # downloads, so the other tag streams are skipped.
  publish-aur:
    name: Publish AUR Package
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
