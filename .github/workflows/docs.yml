name: Documentation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: documentation-production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://panache.bz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build documentation
        uses: ./.github/actions/build-docs

      - name: Deploy to Cloudflare Workers
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Submit sitemap to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: https://panache.bz/sitemap.xml
          key: d8f6b1cafaee4cbc8aec36e0b9b5bb01
          failure-strategy: error

  lighthouse:
    name: Lighthouse Audit
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit URLs using Lighthouse
        run: npx unlighthouse-ci --site https://panache.bz --build-static
