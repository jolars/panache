version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directories:
      # The root workspace includes all members under `crates/`.
      - "/"
      # `editors/zed` is a separate workspace with its own lockfile. Without it
      # here the Zed extension is never updated, and the `zed_extension_api`
      # ignore rule below has nothing to apply to.
      - "/editors/zed"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "zed_extension_api"
        versions: [">=0.7.0"]
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/editors/code"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/vscode"
  - package-ecosystem: "npm"
    directory: "/npm/panache-cli"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
