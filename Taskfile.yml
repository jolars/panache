version: "3"

vars:
  BENCH_COMMON_TOOLS: bash cargo curl git python3 hyperfine jq
  BENCH_FORMATTER_TOOLS: prettier pandoc rumdl mdformat yamark mado markdownlint markdownlint-cli2
  BENCH_LINTER_TOOLS: rumdl mado markdownlint markdownlint-cli2
  BENCH_LSP_TOOLS: realpath sha256sum

tasks:
  lint:
    desc: Run linter
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    desc: Check code formatting
    cmds:
      - cargo fmt --

  build-release:
    desc: Build release version
    cmds:
      - cargo build --release

  test:
    desc: Run tests
    cmds:
      - cargo test --workspace

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test

  test-trace:
    desc: Run tests with trace logging for parser
    cmds:
      - RUST_LOG=panache::parser=trace cargo test

  test-quiet:
    desc: Run tests quietly (no debug output)
    cmds:
      - RUST_LOG=off cargo test

  dev:
    desc: Development workflow - check, test, lint
    cmds:
      - cargo check
      - cargo test
      - cargo clippy --all-targets --all-features -- -D warnings

  docs-preview:
    desc: Preview documentation site locally
    cmds:
      - cd docs && quarto preview --no-browser

  docs:build:
    desc: Build documentation and public downloads for Cloudflare Workers
    cmds:
      - bash scripts/build-docs.sh

  docs:worker:
    desc: Preview the built documentation through Cloudflare Workers
    dir: workers
    cmds:
      - npm run dev

  docs:check:
    desc: Test the built website and validate its Workers deployment
    dir: workers
    cmds:
      - npm test
      - npm run deploy:check
      - npm run test:site

  docs:deploy:
    desc: Deploy the built documentation to Cloudflare Workers
    dir: workers
    cmds:
      - npm run deploy

  docs:rules:
    desc: Regenerate the lint rule reference from descriptions and executable examples
    cmds:
      - cargo run --quiet --example docgen

  lighthouse:
    desc: Render docs and run a Lighthouse audit against the local site
    vars:
      PORT: '{{.PORT | default "4210"}}'
    cmds:
      - quarto render docs
      - |
        set -e
        export CHROME_PATH="${CHROME_PATH:-$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable)}"
        python3 -m http.server {{.PORT}} --directory docs/_site --bind 127.0.0.1 >/dev/null 2>&1 &
        SRV=$!
        trap 'kill $SRV 2>/dev/null' EXIT
        for i in $(seq 1 20); do curl -sf "http://127.0.0.1:{{.PORT}}/" >/dev/null && break; sleep 0.3; done
        mkdir -p docs/lighthouse
        lighthouse "http://127.0.0.1:{{.PORT}}/" \
          --quiet \
          --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
          --output=html --output=json \
          --output-path=docs/lighthouse/report \
          --only-categories=performance,accessibility,best-practices,seo
        echo "Report: docs/lighthouse/report.report.html"

  bench:
    vars:
      TOOLS: '{{.BENCH_FORMATTER_TOOLS}} {{.BENCH_LINTER_TOOLS}} {{.BENCH_LSP_TOOLS}}'
      CHECK_LSP: 'true'
    preconditions:
      - sh: &bench-tools-check |
          missing=0
          for tool in {{.BENCH_COMMON_TOOLS}} {{.TOOLS}}; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing benchmark tool: $tool" >&2
              missing=1
            fi
          done
          if [ "{{.CHECK_LSP}}" = "true" ]; then
            for tool in "${MARKSMAN_BIN:-marksman}" "${Q2_BIN:-q2}"; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "Missing benchmark tool: $tool" >&2
                missing=1
              fi
            done
            if [ "$(uname -s)" != Linux ]; then
              echo "LSP benchmarks require Linux" >&2
              missing=1
            fi
          fi
          exit "$missing"
        msg: Install all required benchmark tools before running this task.
    desc: Run all formatter, linter, and LSP benchmarks
    cmds:
      - task: bench:formatter
      - task: bench:linter
      - task: bench:lsp
      - cargo bench --bench cli_cache

  bench:formatter:
    vars:
      TOOLS: '{{.BENCH_FORMATTER_TOOLS}}'
      CHECK_LSP: 'false'
    preconditions:
      - sh: *bench-tools-check
        msg: Install all required benchmark tools before running this task.
    desc: Run formatter benchmarks and comparisons
    cmds:
      - bash benches/documents/download.sh
      - cargo bench --bench formatting
      - bash benches/compare_all.sh --json --out docs/guide/performance_data.json
      - bash benches/compare_multifile.sh
      - bash benches/compare_repo_suite.sh --mode format --track markdown --out docs/guide/performance_repo_markdown_format_data.json
      - bash benches/compare_repo_suite.sh --mode format --track quarto --out docs/guide/performance_repo_quarto_format_data.json

  bench:linter:
    vars:
      TOOLS: '{{.BENCH_LINTER_TOOLS}}'
      CHECK_LSP: 'false'
    preconditions:
      - sh: *bench-tools-check
        msg: Install all required benchmark tools before running this task.
    desc: Run linter benchmarks and comparisons
    cmds:
      - bash benches/documents/download.sh
      - cargo bench --bench linting
      - bash benches/compare_lint_single.sh
      - bash benches/compare_lint.sh
      - bash benches/compare_lint_corpus.sh
      - bash benches/compare_repo_suite.sh --mode lint --track markdown --out docs/guide/performance_repo_markdown_lint_data.json
      - bash benches/compare_repo_suite.sh --mode lint --track quarto --out docs/guide/performance_repo_quarto_lint_data.json

  bench:lsp:
    vars:
      TOOLS: '{{.BENCH_LSP_TOOLS}}'
      CHECK_LSP: 'true'
    preconditions:
      - sh: *bench-tools-check
        msg: Install all required benchmark tools before running this task.
    desc: Run LSP benchmarks, contract checks, and server comparisons
    cmds:
      - bash benches/documents/download.sh
      - PANACHE_LSP_BENCH_ASSERT=1 cargo bench --features lsp --bench lsp_incremental
      - PANACHE_LSP_WRITE_BENCH_ASSERT=1 cargo bench --features lsp --bench lsp_write_phase
      - cargo bench --features lsp --bench lsp_relint --bench lsp_settle
      - bash benches/compare_lsp_memory.sh
      - Q2_BIN="$(command -v "${Q2_BIN:-q2}")" bash benches/compare_lsp_quarto.sh

  wasm-build:
    desc: Build and sync panache-wasm for playground
    cmds:
      - wasm-pack build crates/panache-wasm --target web
      - rm -rf docs/playground/pkg
      - cp -r crates/panache-wasm/pkg docs/playground/
      - rm -f docs/playground/pkg/.gitignore

  playground-serve:
    desc: Serve playground locally
    deps: [wasm-build]
    cmds:
      - cd docs/playground && python3 -m http.server

  update-golden-expected:
    desc: Update expected golden test outputs
    cmds:
      - UPDATE_EXPECTED=1 cargo test --test golden_cases

  update-yaml-fixtures:
    desc: Download and refresh panache-parser yaml-test-suite fixtures (default data-2022-01-17)
    cmds:
      - ./crates/panache-parser/scripts/update-yaml-test-suite-fixtures.sh data-2022-01-17

  update-commonmark-fixtures:
    desc: Download and refresh CommonMark spec.txt fixture (default 0.31.2)
    cmds:
      - ./crates/panache-parser/scripts/update-commonmark-spec-fixtures.sh 0.31.2

  update-myst-fixtures:
    desc: Download and refresh MyST smoke corpus fixtures (default v0.0.5)
    cmds:
      - ./crates/panache-parser/scripts/update-myst-spec-fixtures.sh v0.0.5

  math-symbols:check:
    desc: Check generated math-symbol data against pinned unicode-math v0.8r
    cmds:
      - python3 scripts/gen_math_symbols.py

  math-symbols:sync:
    desc: Regenerate math-symbol data from pinned unicode-math v0.8r
    cmds:
      - python3 scripts/gen_math_symbols.py --write

  aur:push:
    desc: "Manually publish panache-bin to the AUR (CI fallback; args: [version] [pkgrel])"
    cmds:
      - ./scripts/aur_push.sh {{.CLI_ARGS}}

  vsix:
    desc: Build VS Code extension package
    dir: editors/code
    cmds:
      - npm install
      - npm run compile
      - npx @vscode/vsce package
      - code --install-extension *.vsix --force
